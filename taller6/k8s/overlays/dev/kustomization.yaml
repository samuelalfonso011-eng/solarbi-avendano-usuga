# Ambiente DEV: mismo sistema en otro namespace, con menos recursos, el simulador
# cada 2 minutos y NodePorts distintos (se accede con kubectl port-forward).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: microrred-dev
resources:
  - ../../base
configMapGenerator:
  - name: microrred-config
    behavior: merge
    literals:
      - CALCULAR_SHA256=0
      - ALERTA_SIN_DATOS_S=600
patches:
  - target: {kind: Service, name: postgres-externo}
    patch: |-
      - {op: replace, path: /spec/ports/0/nodePort, value: 31432}
  - target: {kind: Service, name: grafana}
    patch: |-
      - {op: replace, path: /spec/ports/0/nodePort, value: 31300}
  - target: {kind: CronJob, name: simulador}
    patch: |-
      - {op: replace, path: /spec/schedule, value: "*/2 * * * *"}
  - target: {kind: StatefulSet, name: postgres}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 512Mi}
      - {op: replace, path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage, value: 1Gi}
