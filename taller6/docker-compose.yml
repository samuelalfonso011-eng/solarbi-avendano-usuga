# Desarrollo local SIN Kubernetes (paso previo al cluster).
#   docker compose up -d postgres grafana simulador
#   docker compose run --rm etl            # carga historica (una vez)
#   docker compose down -v                 # elimina todo, incluidos los datos
# Las credenciales llegan desde .env (no versionado; plantilla: .env.example).
name: microrred-bi

services:
  postgres:
    image: postgres:16.4-alpine
    env_file: [.env]
    environment:
      POSTGRES_DB: microrred
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_PUERTO_LOCAL:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d microrred"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 768M}

  etl:
    build: ./etl
    image: microrred-etl:1.0.0
    profiles: ["etl"]
    env_file: [config/microrred.env]
    environment:
      PGUSER: etl_app
      PGPASSWORD: ${ETL_PASSWORD}
    volumes:
      - ./data/bronze:/datos/bronze:ro
    depends_on:
      postgres: {condition: service_healthy}

  simulador:
    build: ./simulador
    image: microrred-simulador:1.0.0
    env_file: [config/microrred.env]
    environment:
      PGUSER: sim_app
      PGPASSWORD: ${SIM_PASSWORD}
      SIM_MODO: continuo
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M}

  grafana:
    image: grafana/grafana:11.4.0
    env_file: [config/microrred.env]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/microrred_operacion.json
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_PATHS_PROVISIONING: /tmp/provisioning
    # Renderiza los umbrales de las alertas (config/microrred.env) y arranca Grafana
    entrypoint: ["sh", "-c", "sh /scripts/render_provisioning.sh /etc/grafana/provisioning-plantilla /tmp/provisioning && exec /run.sh"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning-plantilla:ro
      - ./grafana/render_provisioning.sh:/scripts/render_provisioning.sh:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PUERTO_LOCAL:-13000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 384M}

volumes:
  pgdata:
